<style>
/* Layout: editorial two-column sections (label column + content column) on a 12-col rhythm; the face map is the one bold object. */
:root{
  --bg:#F7F5F6;
  --surface:#FFFFFF;
  --ink:#241B23;
  --muted:#5C505B;
  --line:#E3DBE0;
  --accent:#86516A;
  --accent-soft:#F1E6EB;
  --zone:#C7849F;
  --warn:#94562B;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s1:.5rem;--s2:1rem;--s3:1.5rem;--s4:2.5rem;--s5:4.5rem;
  --radius:6px;
  --ok:#3D6A4C;--ok-bg:#E7F1EA;--mid:#8A5A1E;--mid-bg:#F7EDDF;--bad:#9B3A55;--bad-bg:#F6E4EA;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18121A;--surface:#221A23;--ink:#F2EAEF;--muted:#B6A7B2;--line:#372B35;
  --accent:#DBA5BB;--accent-soft:#35242E;--zone:#B66A8B;--warn:#E5A87A;--ok:#8FC6A0;--ok-bg:#1F2E24;--mid:#E6B676;--mid-bg:#33281A;--bad:#E79AB2;--bad-bg:#3A1F29;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18121A;--surface:#221A23;--ink:#F2EAEF;--muted:#B6A7B2;--line:#372B35;
  --accent:#DBA5BB;--accent-soft:#35242E;--zone:#B66A8B;--warn:#E5A87A;--ok:#8FC6A0;--ok-bg:#1F2E24;--mid:#E6B676;--mid-bg:#33281A;--bad:#E79AB2;--bad-bg:#3A1F29;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:1.0625rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:72rem;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0;hyphens:manual}
h1{font-size:clamp(2.4rem,5.2vw,4.25rem);letter-spacing:-.01em}
h1 span{display:block}
h1 em{color:var(--accent)}
h2{font-size:clamp(1.9rem,3.4vw,2.75rem);letter-spacing:-.005em}
h3{font-size:1.35rem;line-height:1.25}
p{margin:0;max-width:60ch}
a{color:var(--accent)}
.eyebrow{font-weight:500;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mono{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:var(--s2) var(--s4);flex-wrap:wrap;padding-block:1.25rem;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:500;font-size:1.35rem;letter-spacing:.28em;color:var(--ink);text-decoration:none;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
nav{display:flex;gap:var(--s3);flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-size:.92rem}
nav a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:transparent;border:0;color:var(--muted);padding:.25rem .75rem;border-radius:999px;font-size:.8rem;font-weight:500;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:7fr 5fr;gap:var(--s5);align-items:center;padding-block:var(--s5)}
.hero-copy{min-width:0;display:flex;flex-direction:column;gap:var(--s3)}
.lead{font-size:1.15rem;color:var(--muted)}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:.8rem 1.5rem;border-radius:999px;font-weight:500;font-size:.95rem;text-decoration:none;display:inline-block;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:not(.ghost):hover{opacity:.9}
.btn[disabled]{opacity:.3;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.profile{padding:var(--s3);display:flex;flex-direction:column;min-width:0}
.profile header{all:unset;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.profile dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.profile dt,.profile dd{padding-block:.8rem;border-bottom:1px solid var(--line);margin:0}
.profile dt{color:var(--muted);font-size:.92rem;padding-right:var(--s2)}
.profile dd{text-align:right;font-weight:500;min-width:0}
.profile dd.mono{font-weight:400;color:var(--ink)}
.profile dt:last-of-type,.profile dd:last-of-type{border-bottom:0;padding-bottom:0}

/* sections */
section{display:grid;grid-template-columns:4fr 8fr;gap:var(--s3) var(--s5);padding-block:var(--s5);border-top:1px solid var(--line)}
section > *{min-width:0}
.sec-head{display:flex;flex-direction:column;gap:var(--s2);align-self:start}
section.wide{grid-template-columns:1fr}
section.wide .sec-head{max-width:44rem}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:4rem 1fr;gap:var(--s2);padding-block:var(--s3);border-bottom:1px solid var(--line)}
.steps li:first-child{padding-top:0}
.steps li:last-child{border-bottom:0;padding-bottom:0}
.steps li::before{counter-increment:s;content:"0" counter(s);font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--accent)}
.steps li div{display:flex;flex-direction:column;gap:.35rem;min-width:0}

/* quiz */
.quiz{padding:var(--s4)}
.progress{height:2px;background:var(--line);margin-bottom:var(--s3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:var(--s2);margin-bottom:.75rem}
.quiz h3{margin-bottom:var(--s3);font-size:1.6rem}
.opts{display:grid;gap:.6rem}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:.85rem 1.1rem;display:flex;align-items:center;gap:.8rem}
.opt::before{content:"";flex:none;width:.9rem;height:.9rem;border:1px solid var(--muted);border-radius:50%}
.opts.multi .opt::before{border-radius:3px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.qnav{display:flex;justify-content:space-between;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap}
.start{display:flex;flex-direction:column;gap:var(--s3)}
.start ul{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.start li{display:flex;gap:.75rem}
.start li::before{content:"";flex:none;width:.4rem;height:.4rem;margin-top:.65rem;border-radius:50%;background:var(--accent)}

/* result */
.result{display:flex;flex-direction:column;gap:var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:.25rem .85rem;font-size:.88rem;font-weight:500}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);padding-block:var(--s3);border-block:1px solid var(--line)}
.routine > div{min-width:0}
.routine ol{margin:.75rem 0 0;padding:0;list-style:none;display:grid;gap:.85rem;counter-reset:r}
.routine li{display:grid;grid-template-columns:1.6rem 1fr;gap:.25rem}
.routine li::before{counter-increment:r;content:counter(r);font-family:var(--display);color:var(--accent);font-size:1.1rem;line-height:1.4}
.routine li small{display:block;margin-top:.15rem}
.note{border-left:2px solid var(--warn);padding-left:var(--s2)}
.note b{color:var(--warn);font-weight:500}
.fine{font-size:.88rem;color:var(--muted)}
.copied{font-size:.88rem;color:var(--accent)}

/* face map */
.map{display:grid;grid-template-columns:5fr 7fr;gap:var(--s5);align-items:start}
.map > *{min-width:0}
.face-wrap{padding:0;overflow:hidden;display:flex;justify-content:center;background:#e9e4e2}
.face{width:100%;height:auto;display:block}
.face .z{fill:#FFFFFF;fill-opacity:.26;stroke:#FFFFFF;stroke-opacity:.95;stroke-width:2.5;opacity:0;transition:opacity .45s}
.face .z.on{opacity:1}
.face .avoid{fill:none;stroke:#F2A7BD;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;opacity:0;transition:opacity .45s}
.face .avoid.on{opacity:1}
.detail{display:flex;flex-direction:column;gap:var(--s3)}
.products{display:flex;flex-wrap:wrap;gap:.5rem}
.pbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.92rem}
.pbtn:hover{border-color:var(--ink)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.detail h3{font-size:1.75rem}
.detail dl{display:grid;grid-template-columns:7.5rem 1fr;margin:0}
.detail dt,.detail dd{margin:0;padding-block:.75rem;border-top:1px solid var(--line)}
.detail dt{font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:.95rem}
.detail dd{min-width:0}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend span::before{content:"";width:.85rem;height:.85rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--muted)}
.legend span.av::before{background:transparent;border:1.5px dotted #D9849E}

/* app mockups: the phone screens keep the app's own light look in both themes */
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);justify-items:center}
.phones figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--s2);width:100%;max-width:290px}
.phones figcaption{font-size:.92rem;color:var(--muted);text-align:center;max-width:24ch}
.phone{width:100%;aspect-ratio:9/19;border-radius:44px;background:#1E171D;padding:9px;box-shadow:0 40px 60px -40px rgba(36,27,35,.55)}
.screen{height:100%;border-radius:35px;background:#FAF7F8;color:#241B23;overflow:hidden;display:flex;flex-direction:column;font-size:.78rem;line-height:1.4}
.notch{flex:none;width:86px;height:22px;background:#1E171D;border-radius:0 0 14px 14px;margin:0 auto}
.sbody{flex:1;min-height:0;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.a-h{font-family:var(--display);font-size:1.45rem;line-height:1.15}
.a-h2{font-family:var(--display);font-size:1.1rem;line-height:1.2}
.a-muted{color:#7A6C78;font-size:.72rem}
.a-label{font-size:.62rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#86516A;margin-bottom:4px}
.acard{background:#FFFFFF;border:1px solid #EDE5EA;border-radius:16px;padding:11px 12px}
.a-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.a-pill{font-size:.65rem;background:#F1E6EB;color:#86516A;border-radius:999px;padding:2px 8px;white-space:nowrap}
.a-bar{height:4px;background:#EFE8EC;border-radius:4px;margin:8px 0 6px;overflow:hidden}
.a-bar i{display:block;height:100%;background:#86516A}
.a-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.a-steps li{display:flex;gap:8px;align-items:center}
.a-steps li::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid #C9B6C0}
.a-steps li.done::before{background:#86516A;border-color:#86516A;box-shadow:inset 0 0 0 3px #FFFFFF}
.a-steps li.done span{color:#7A6C78;text-decoration:line-through;text-decoration-color:#C9B6C0}
.a-arrow{font-size:1.2rem;color:#86516A}
.a-week{display:flex;justify-content:space-between;gap:4px}
.a-week .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;background:#86516A;color:#FFFFFF}
.a-week .d.half{background:#D7AFC0}
.a-week .d.today{background:transparent;color:#86516A;border:1.5px solid #86516A}
.a-tip{background:#F4ECEF;border-color:#F4ECEF}
.a-prod{display:flex;justify-content:center;background:#F3ECEF;border-radius:16px;padding:8px}
.a-fit{align-self:flex-start;font-size:.68rem;font-weight:500;color:#3F6B4E;background:#E5F0E8;border-radius:999px;padding:3px 9px}
.a-chips{display:flex;flex-wrap:wrap;gap:4px}
.a-chips span{font-family:var(--mono);font-size:.62rem;border:1px solid #E3D6DC;border-radius:999px;padding:2px 7px}
.a-ad{font-size:.6rem;color:#7A6C78;border:1px solid #E3D6DC;border-radius:4px;padding:1px 5px}
.a-btn{margin-top:auto;text-align:center;background:#241B23;color:#FAF7F8;border-radius:999px;padding:9px;font-weight:500}
.a-bars{display:flex;align-items:flex-end;gap:10px;height:70px;padding-top:4px}
.a-bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.a-bars i{display:block;width:100%;background:#D7AFC0;border-radius:6px 6px 2px 2px}
.a-bars div:last-child i{background:#86516A}
.a-bars span{font-size:.6rem;color:#7A6C78}
.tabbar{flex:none;display:flex;justify-content:space-around;padding:9px 6px 16px;border-top:1px solid #EDE5EA;background:#FFFFFF;font-size:.62rem;color:#8A7D88}

  I:{
    niacinamide:["Niacinamid (Vitamin B3)","Stärkt die Hautbarriere, reguliert Talg, mildert Rötungen und hellt Flecken auf.","Fast alle Hauttypen, besonders Mischhaut, fettige Haut und Pigmentflecken.","Morgens und/oder abends, meist als Serum.","Hohe Konzentrationen können empfindliche Haut reizen. Mit niedrigen Prozentwerten beginnen."],

    aha:["Fruchtsäuren (AHA)","Peelen die Hautoberfläche und machen das Hautbild glatter und ebenmäßiger.","Fahle Haut, raue Hautstruktur, Pigmentflecken, normale bis trockene Haut.","Abends, 1–3 Mal pro Woche.","Machen die Haut sonnenempfindlicher. Bei empfindlicher Haut eher Milchsäure wählen."],
    retinol:["Retinol (Vitamin A)","Beschleunigt die Zellerneuerung, mildert feine Linien und verbessert das Hautbild.","Feine Linien, Unreinheiten, unebene Haut.","Nur abends. Anfangs 1–2 Mal pro Woche, dann langsam steigern.","Kann anfangs reizen und schuppen. Täglich Sonnenschutz verwenden. In Schwangerschaft und Stillzeit nicht anwenden."],
    vitc:["Vitamin C","Antioxidans: schützt vor Umwelteinflüssen, sorgt für einen frischen Teint und hellt Flecken auf.","Fahle Haut, Pigmentflecken, Schutz am Morgen.","Morgens, vor dem Sonnenschutz.","Reines Vitamin C ist licht- und luftempfindlich. Wird das Produkt gelb oder braun, ist es oxidiert."],
    azelaic:["Azelainsäure","Beruhigt Rötungen, wirkt gegen Unreinheiten und hellt Flecken auf.","Unreinheiten, Rötungen, Aknemale, empfindliche Haut.","Morgens und/oder abends.","Kann anfangs leicht kribbeln. Bei Rosazea die Behandlung hautärztlich abstimmen."],
    bpo:["Benzoylperoxid","Wirkt gegen Bakterien, die an der Entstehung von Akne beteiligt sind.","Entzündete Pickel, Akne.","Punktuell oder als Reinigung, meist einmal täglich.","Kann Textilien und Haare bleichen und die Haut austrocknen."],
    ha:["Hyaluronsäure","Bindet Feuchtigkeit in der Haut und polstert sie sichtbar auf.","Alle Hauttypen, besonders bei Feuchtigkeitsmangel.","Morgens und abends auf die leicht feuchte Haut, danach eincremen.","Ohne Creme darüber kann die Haut bei trockener Luft wieder austrocknen."],
    ceramide:["Ceramide","Hautähnliche Lipide, die die Hautbarriere stärken und Feuchtigkeitsverlust verhindern.","Trockene, empfindliche oder gereizte Haut.","Morgens und abends, meist in der Creme.","Sehr gut verträglich. Passt zu fast allen Wirkstoffen."],
    panthenol:["Panthenol (Provitamin B5)","Beruhigt, spendet Feuchtigkeit und unterstützt die Regeneration der Haut.","Empfindliche, gereizte oder trockene Haut.","Morgens und abends.","Sehr gut verträglich."]

/* ---------- quiz ---------- */
const qEl = $("#quiz");
const save = () => store.set("skinai-quiz2", st);
function renderQuiz(){
  const t = L();
  if(st.i < 0){
    qEl.innerHTML = `<div class="start">
      <span class="mono">${esc(t.qStartMeta)}</span>
      <h3>${esc(t.qStartTitle)}</h3>
      <ul>${t.qStartList.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="btns"><button class="btn" id="q-start">${esc(t.qStartBtn)}</button></div></div>`;
    $("#q-start").onclick = () => { st = {i:0,a:{}}; save(); renderQuiz(); };
    return;
  }
  if(st.i >= LOGIC.length) return renderResult();
  const lg = LOGIC[st.i], [qt, opts] = t.Q[st.i], sel = st.a[lg.k] || [];
  qEl.innerHTML = `
    <div class="progress"><i style="width:${Math.round(st.i/LOGIC.length*100)}%"></i></div>
    <div class="qmeta"><span class="mono">${esc(t.qOf(st.i+1, LOGIC.length))}</span>${lg.multi?`<span class="mono">${esc(t.qMulti)}</span>`:""}</div>
    <h3>${esc(qt)}</h3>
    <div class="opts${lg.multi?" multi two":""}">${opts.map((o,j)=>`<button class="opt" data-j="${j}" aria-pressed="${sel.includes(j)}">${esc(o)}</button>`).join("")}</div>
    <div class="qnav">
      <button class="btn ghost" id="q-back">${esc(t.qBack)}</button>
      <button class="btn" id="q-next" ${sel.length?"":"disabled"}>${esc(st.i===LOGIC.length-1?t.qDone:t.qNext)}</button>
    </div>`;
  qEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const j = +b.dataset.j;
    if(lg.multi){
      let cur = (st.a[lg.k]||[]).slice();
      if(lg.o[j].none) cur = [j];
      else { cur = cur.filter(x => !lg.o[x].none); cur = cur.includes(j) ? cur.filter(x=>x!==j) : cur.concat(j); }
      st.a[lg.k] = cur; save(); renderQuiz();
    } else { st.a[lg.k] = [j]; st.i++; save(); renderQuiz(); }
  });
  $("#q-back").onclick = () => { st.i--; save(); renderQuiz(); };
  $("#q-next").onclick = () => { st.i++; save(); renderQuiz(); };
}
function score(){
  const s = {oily:0,combo:0,normal:0,dry:0,sens:0,dehyd:0}, concerns = new Set(), flags = new Set(); let spf=false;
  LOGIC.forEach(q => (st.a[q.k]||[]).forEach(j => {
    const v = q.o[j];
    for(const d in s) if(v[d]) s[d]+=v[d];
    if(v.c) concerns.add(v.c); if(v.flag) flags.add(v.flag); if(v.spf) spf=true;
  }));
  const r = ["oily","combo","normal","dry"].sort((x,y)=>s[y]-s[x]);
  if(s.dehyd) concerns.add("dehyd");
  return {type: s[r[0]]-s[r[1]] >= 1 ? r[0] : "und", sens: s.sens>=4?"high":s.sens>=2?"mid":"low", concerns:[...concerns], flags, spf};
}
function routine(r){
  const t = L().rt, moist = t.moist[r.type];
  const cl = (r.type==="dry"||r.sens==="high") ? t.cleanseSoft : t.cleanse;
  const am = [[cl,""],[moist, r.type==="dry"?"Ceramide NP · Glycerin":"Glycerin · Niacinamide"],[t.spf,t.spfNote]];
  const c = r.concerns, pm = [[cl,""]];
  if(r.sens==="high") pm.push([t.calm,"Panthenol · Ceramide NP · Allantoin"]);
  else {
    if(c.some(x=>["acne","blackheads","pores"].includes(x))) pm.push([t.bha,"Salicylic Acid"]);
    if(c.some(x=>["marks","pigment"].includes(x))) pm.push([t.spots,"Niacinamide · Azelaic Acid"]);
    if(c.includes("lines")) pm.push([t.retinoid,"Retinol"]);
    if(c.includes("redness")) pm.push([t.red,"Azelaic Acid · Panthenol"]);
  }
  pm.push([moist,""]);
  return {am,pm};
}
function renderResult(){
  const t = L(), r = score(), rt = routine(r);
  const li = a => a.map(([n,i]) => `<li><span>${esc(n)}${i?`<small class="mono">${esc(i)}</small>`:""}</span></li>`).join("");
  const n = [];
  if(r.type==="und") n.push(t.notes.und);
  if(r.sens==="high") n.push(t.notes.sens);
  if(r.flags.has("redness")) n.push(t.notes.red);
  if(!r.spf) n.push(t.notes.spf);
  if(r.sens!=="high" && r.concerns.includes("lines") && r.concerns.some(x=>["acne","blackheads","pores"].includes(x))) n.push(t.notes.mix);
  const cNames = r.concerns.map(x=>t.conc[x]);
  const summary = t.rSummary(t.types[r.type], t.sens[r.sens], cNames.join(", "));
  qEl.innerHTML = `<div class="result">
    <span class="eyebrow">${esc(t.rEyebrow)}</span>
    <h3>${esc(t.types[r.type])} · ${esc(t.sens[r.sens])}</h3>
    ${cNames.length?`<div class="chips">${cNames.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:`<p class="muted">${esc(t.rNone)}</p>`}
    <div class="routine">
      <div><span class="eyebrow">${esc(t.rAm)}</span><ol>${li(rt.am)}</ol></div>
      <div><span class="eyebrow">${esc(t.rPm)}</span><ol>${li(rt.pm)}</ol></div>
    </div>
    ${n.map(x=>`<p class="note">${x}</p>`).join("")}
    <p class="fine">${esc(t.rFine)}</p>
    <div class="btns"><button class="btn" id="q-copy">${esc(t.rCopy)}</button><button class="btn ghost" id="q-redo">${esc(t.rRedo)}</button></div>
    <span class="copied" id="q-copied" hidden>${esc(t.rCopied)}</span>
    <p class="mono" id="q-sum" hidden>${esc(summary)}</p></div>`;
  $("#q-redo").onclick = () => { st = {i:0,a:{}}; save(); renderQuiz(); };
  $("#q-copy").onclick = () => {
    const ok = () => { $("#q-copied").hidden = false; };
    const fb = () => { const p=$("#q-sum"); p.hidden=false; const g=document.createRange(); g.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(g); };
    try{ navigator.clipboard.writeText(summary).then(ok, fb); }catch(e){ fb(); }
  };
}

/* ---------- ingredient lexicon & combo check ---------- */
const ING = [["niacinamide","Niacinamide"],["bha","Salicylic Acid"],["aha","Glycolic Acid · Lactic Acid"],["retinol","Retinol"],["vitc","Ascorbic Acid"],["azelaic","Azelaic Acid"],["bpo","Benzoyl Peroxide"],["ha","Sodium Hyaluronate"],["ceramide","Ceramide NP"],["panthenol","Panthenol"]];
const GENTLE = ["ha","ceramide","panthenol"], ACIDS = ["aha","bha"];
let ingSel = 3, cA = "retinol", cB = "vitc";
function pairRule(a,b){
  const has = (x,y) => (a===x&&b===y)||(a===y&&b===x);
  const one = (x,list) => (a===x&&list.includes(b))||(b===x&&list.includes(a));
  if(a===b) return ["none",null];
  if(GENTLE.includes(a)||GENTLE.includes(b)) return ["good","gentle"];
  if(has("niacinamide","retinol")) return ["good","nia_ret"];
  if(has("niacinamide","vitc")) return ["good","nia_vitc"];
  if(a==="niacinamide"||b==="niacinamide") return ["good","nia_any"];
  if(one("retinol",ACIDS)) return ["split","ret_acid"];
  if(has("retinol","bpo")) return ["split","ret_bpo"];
  if(has("retinol","vitc")) return ["split","ret_vitc"];
  if(has("retinol","azelaic")) return ["caution","ret_aze"];
  if(has("aha","bha")) return ["caution","aha_bha"];
  if(one("vitc",ACIDS)) return ["split","vitc_acid"];
  if(has("vitc","bpo")) return ["split","vitc_bpo"];
  if(one("bpo",ACIDS)) return ["caution","bpo_acid"];
  if(one("azelaic",ACIDS)) return ["caution","aze_acid"];
  if(has("azelaic","vitc")) return ["good","aze_vitc"];
  if(has("azelaic","bpo")) return ["caution","aze_bpo"];
  return ["caution",null];
}
function renderLex(){
  const t = L(), list = $("#ingList"); list.innerHTML = ""; list.setAttribute("aria-label", t.lexEyebrow);
  ING.forEach(([k,inci],i) => {
    const b = document.createElement("button"); b.className = "ibtn";
    b.innerHTML = `<b>${esc(t.I[k][0])}</b><small>${esc(inci)}</small>`;
    b.onclick = () => showIng(i); list.appendChild(b);
  });
  showIng(ingSel);
  for(const [id,val] of [["#cSelA",cA],["#cSelB",cB]]){
    const sel = $(id); sel.innerHTML = ING.map(([k]) => `<option value="${k}">${esc(t.I[k][0])}</option>`).join(""); sel.value = val;
  }
  renderCombo();
}
function showIng(i){
  ingSel = i; const [k,inci] = ING[i], v = L().I[k];
  document.querySelectorAll(".ibtn").forEach((b,j) => b.setAttribute("aria-pressed", j===i));
  $("#iInci").textContent = inci; $("#iName").textContent = v[0];
  $("#iDoes").textContent = v[1]; $("#iFor").textContent = v[2]; $("#iUse").textContent = v[3]; $("#iWarn").textContent = v[4];
}
function renderCombo(){
  const t = L(), [lv,key] = pairRule(cA,cB);
  $("#cRes").className = "combo-res " + lv;
  $("#cBadge").textContent = t.lv[lv];
  $("#cText").textContent = lv==="none" ? t.cSame : t.C[key];
}
$("#cSelA").onchange = e => { cA = e.target.value; renderCombo(); };
$("#cSelB").onchange = e => { cB = e.target.value; renderCombo(); };

applyLang();
