/* Layout: editorial two-column sections (label column + content column) on a 12-col rhythm; the face map is the one bold object. */
:root{
  --bg:#F7F5F6;
  --surface:#FFFFFF;
  --ink:#241B23;
  --muted:#5C505B;
  --line:#E3DBE0;
  --accent:#86516A;
  --accent-soft:#F1E6EB;
  --zone:#C7849F;
  --warn:#94562B;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s1:.5rem;--s2:1rem;--s3:1.5rem;--s4:2.5rem;--s5:4.5rem;
  --radius:6px;
  --ok:#3D6A4C;--ok-bg:#E7F1EA;--mid:#8A5A1E;--mid-bg:#F7EDDF;--bad:#9B3A55;--bad-bg:#F6E4EA;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18121A;--surface:#221A23;--ink:#F2EAEF;--muted:#B6A7B2;--line:#372B35;
  --accent:#DBA5BB;--accent-soft:#35242E;--zone:#B66A8B;--warn:#E5A87A;--ok:#8FC6A0;--ok-bg:#1F2E24;--mid:#E6B676;--mid-bg:#33281A;--bad:#E79AB2;--bad-bg:#3A1F29;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18121A;--surface:#221A23;--ink:#F2EAEF;--muted:#B6A7B2;--line:#372B35;
  --accent:#DBA5BB;--accent-soft:#35242E;--zone:#B66A8B;--warn:#E5A87A;--ok:#8FC6A0;--ok-bg:#1F2E24;--mid:#E6B676;--mid-bg:#33281A;--bad:#E79AB2;--bad-bg:#3A1F29;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:1.0625rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:72rem;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0;hyphens:manual}
h1{font-size:clamp(2.4rem,5.2vw,4.25rem);letter-spacing:-.01em}
h1 span{display:block}
h1 em{color:var(--accent)}
h2{font-size:clamp(1.9rem,3.4vw,2.75rem);letter-spacing:-.005em}
h3{font-size:1.35rem;line-height:1.25}
p{margin:0;max-width:60ch}
a{color:var(--accent)}
.eyebrow{font-weight:500;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mono{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
.site-header{display:flex;justify-content:space-between;align-items:center;gap:var(--s2) var(--s4);flex-wrap:wrap;padding-block:.9rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.site-header::after{content:"";position:absolute;bottom:0;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));height:1px;background:var(--line)}
.site-header.scrolled{box-shadow:0 10px 24px -22px rgba(36,27,35,.6)}
.logo{font-family:var(--display);font-weight:500;font-size:1.35rem;letter-spacing:.28em;color:var(--ink);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:.6rem}
.mark{width:1.7rem;height:1.7rem;flex:none;color:var(--ink)}
.mark-dot{fill:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
nav{display:flex;gap:var(--s3);flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-size:.92rem;padding-block:.5rem;display:inline-block;white-space:nowrap}
nav a.active{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:6px}
section{scroll-margin-top:5.5rem}
nav a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:transparent;border:0;color:var(--muted);min-width:44px;min-height:36px;padding:.25rem .8rem;border-radius:999px;font-size:.8rem;font-weight:500;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:7fr 5fr;gap:var(--s5);align-items:center;padding-block:var(--s4) var(--s5)}
.hero-visual{position:relative;min-width:0;padding-bottom:var(--s4)}
.hero h1{font-size:clamp(2.4rem,4.4vw,3.7rem)}
.hero-photo{border-radius:var(--radius);overflow:hidden;background:#e9e4e2;aspect-ratio:3/4;max-width:100%}
.hero-photo svg{display:block;width:100%;height:100%}
.hero-visual .profile{position:absolute;left:-18%;bottom:0;width:min(330px,80%);box-shadow:0 30px 50px -30px rgba(36,27,35,.45);padding:var(--s2) var(--s3)}
.hero-visual .profile dt,.hero-visual .profile dd{padding-block:.55rem;font-size:.88rem}
.hero-visual .profile dt:nth-of-type(n+4),.hero-visual .profile dd:nth-of-type(n+4){display:none}
.hero-visual .profile dd:nth-of-type(3){border-bottom:0;padding-bottom:0}
.hero-visual .profile dt:nth-of-type(3){border-bottom:0;padding-bottom:0}
.hero-copy{min-width:0;display:flex;flex-direction:column;gap:var(--s3)}
.lead{font-size:1.15rem;color:var(--muted)}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:.8rem 1.5rem;border-radius:999px;font-weight:500;font-size:.95rem;text-decoration:none;display:inline-block;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:not(.ghost):hover{opacity:.9}
.btn[disabled]{opacity:.3;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.profile{padding:var(--s3);display:flex;flex-direction:column;min-width:0}
.profile header{all:unset;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.profile dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.profile dt,.profile dd{padding-block:.8rem;border-bottom:1px solid var(--line);margin:0}
.profile dt{color:var(--muted);font-size:.92rem;padding-right:var(--s2)}
.profile dd{text-align:right;font-weight:500;min-width:0}
.profile dd.mono{font-weight:400;color:var(--ink)}
.profile dt:last-of-type,.profile dd:last-of-type{border-bottom:0;padding-bottom:0}

/* sections */
section{display:grid;grid-template-columns:4fr 8fr;gap:var(--s3) var(--s5);padding-block:var(--s5);border-top:1px solid var(--line)}
section > *{min-width:0}
.sec-head{display:flex;flex-direction:column;gap:var(--s2);align-self:start}
section.wide{grid-template-columns:1fr}
section.wide .sec-head{max-width:44rem}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:4rem 1fr;gap:var(--s2);padding-block:var(--s3);border-bottom:1px solid var(--line)}
.steps li:first-child{padding-top:0}
.steps li:last-child{border-bottom:0;padding-bottom:0}
.steps li::before{counter-increment:s;content:"0" counter(s);font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--accent)}
.steps li div{display:flex;flex-direction:column;gap:.35rem;min-width:0}

/* quiz */
.quiz{padding:var(--s4)}
.progress{height:2px;background:var(--line);margin-bottom:var(--s3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:var(--s2);margin-bottom:.75rem}
.quiz h3{margin-bottom:var(--s3);font-size:1.6rem}
.opts{display:grid;gap:.6rem}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:.85rem 1.1rem;display:flex;align-items:center;gap:.8rem}
.opt::before{content:"";flex:none;width:.9rem;height:.9rem;border:1px solid var(--muted);border-radius:50%}
.opts.multi .opt::before{border-radius:3px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.qnav{display:flex;justify-content:space-between;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap}
.start{display:flex;flex-direction:column;gap:var(--s3)}
.start ul{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.start li{display:flex;gap:.75rem}
.start li::before{content:"";flex:none;width:.4rem;height:.4rem;margin-top:.65rem;border-radius:50%;background:var(--accent)}

/* result */
.result{display:flex;flex-direction:column;gap:var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:.25rem .85rem;font-size:.88rem;font-weight:500}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);padding-block:var(--s3);border-block:1px solid var(--line)}
.routine > div{min-width:0}
.routine ol{margin:.75rem 0 0;padding:0;list-style:none;display:grid;gap:.85rem;counter-reset:r}
.routine li{display:grid;grid-template-columns:1.6rem 1fr;gap:.25rem}
.routine li::before{counter-increment:r;content:counter(r);font-family:var(--display);color:var(--accent);font-size:1.1rem;line-height:1.4}
.routine li small{display:block;margin-top:.15rem}
.note{border-left:2px solid var(--warn);padding-left:var(--s2)}
.note b{color:var(--warn);font-weight:500}
.fine{font-size:.88rem;color:var(--muted)}
.copied{font-size:.88rem;color:var(--accent)}

/* face map */
.map{display:grid;grid-template-columns:5fr 7fr;gap:var(--s5);align-items:start}
.map > *{min-width:0}
.face-wrap{padding:0;overflow:hidden;display:flex;justify-content:center;background:#e9e4e2}
.face{width:100%;height:auto;display:block}
.face .z{fill:#FFFFFF;fill-opacity:.26;stroke:#FFFFFF;stroke-opacity:.95;stroke-width:2.5;opacity:0;transition:opacity .45s}
.face .z.on{opacity:1}
.face .avoid{fill:none;stroke:#F2A7BD;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;opacity:0;transition:opacity .45s}
.face .avoid.on{opacity:1}
.detail{display:flex;flex-direction:column;gap:var(--s3)}
.products{display:flex;flex-wrap:wrap;gap:.5rem}
.pbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.92rem}
.pbtn:hover{border-color:var(--ink)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.detail h3{font-size:1.75rem}
.detail dl{display:grid;grid-template-columns:7.5rem 1fr;margin:0}
.detail dt,.detail dd{margin:0;padding-block:.75rem;border-top:1px solid var(--line)}
.detail dt{font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:.95rem}
.detail dd{min-width:0}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend span::before{content:"";width:.85rem;height:.85rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--muted)}
.legend span.av::before{background:transparent;border:1.5px dotted #D9849E}

/* app mockups: the phone screens keep the app's own light look in both themes */
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);justify-items:center}
.phones figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--s2);width:100%;max-width:290px}

  I:{
    niacinamide:["Niacinamid (Vitamin B3)","Stärkt die Hautbarriere, reguliert Talg, mildert Rötungen und hellt Flecken auf.","Fast alle Hauttypen, besonders Mischhaut, fettige Haut und Pigmentflecken.","Morgens und/oder abends, meist als Serum.","Hohe Konzentrationen können empfindliche Haut reizen. Mit niedrigen Prozentwerten beginnen."],
    bha:["Salicylsäure (BHA)","Löst Talg und abgestorbene Hautzellen in den Poren und wirkt gegen Mitesser und Unreinheiten.","Fettige Haut, Mischhaut, Mitesser, Akne.","Abends, 2–3 Mal pro Woche, langsam steigern.","Kann austrocknen. Am nächsten Tag Sonnenschutz verwenden."],
    aha:["Fruchtsäuren (AHA)","Peelen die Hautoberfläche und machen das Hautbild glatter und ebenmäßiger.","Fahle Haut, raue Hautstruktur, Pigmentflecken, normale bis trockene Haut.","Abends, 1–3 Mal pro Woche.","Machen die Haut sonnenempfindlicher. Bei empfindlicher Haut eher Milchsäure wählen."],
    retinol:["Retinol (Vitamin A)","Beschleunigt die Zellerneuerung, mildert feine Linien und verbessert das Hautbild.","Feine Linien, Unreinheiten, unebene Haut.","Nur abends. Anfangs 1–2 Mal pro Woche, dann langsam steigern.","Kann anfangs reizen und schuppen. Täglich Sonnenschutz verwenden. In Schwangerschaft und Stillzeit nicht anwenden."],
    vitc:["Vitamin C","Antioxidans: schützt vor Umwelteinflüssen, sorgt für einen frischen Teint und hellt Flecken auf.","Fahle Haut, Pigmentflecken, Schutz am Morgen.","Morgens, vor dem Sonnenschutz.","Reines Vitamin C ist licht- und luftempfindlich. Wird das Produkt gelb oder braun, ist es oxidiert."],
    azelaic:["Azelainsäure","Beruhigt Rötungen, wirkt gegen Unreinheiten und hellt Flecken auf.","Unreinheiten, Rötungen, Aknemale, empfindliche Haut.","Morgens und/oder abends.","Kann anfangs leicht kribbeln. Bei Rosazea die Behandlung hautärztlich abstimmen."],
    bpo:["Benzoylperoxid","Wirkt gegen Bakterien, die an der Entstehung von Akne beteiligt sind.","Entzündete Pickel, Akne.","Punktuell oder als Reinigung, meist einmal täglich.","Kann Textilien und Haare bleichen und die Haut austrocknen."],
    ha:["Hyaluronsäure","Bindet Feuchtigkeit in der Haut und polstert sie sichtbar auf.","Alle Hauttypen, besonders bei Feuchtigkeitsmangel.","Morgens und abends auf die leicht feuchte Haut, danach eincremen.","Ohne Creme darüber kann die Haut bei trockener Luft wieder austrocknen."],
    ceramide:["Ceramide","Hautähnliche Lipide, die die Hautbarriere stärken und Feuchtigkeitsverlust verhindern.","Trockene, empfindliche oder gereizte Haut.","Morgens und abends, meist in der Creme.","Sehr gut verträglich. Passt zu fast allen Wirkstoffen."],
    panthenol:["Panthenol (Provitamin B5)","Beruhigt, spendet Feuchtigkeit und unterstützt die Regeneration der Haut.","Empfindliche, gereizte oder trockene Haut.","Morgens und abends.","Sehr gut verträglich."]
  },

  dsSub:"Fotos vom Gesicht und Angaben zur Haut sind sensible Daten. Diese Grundsätze gelten von Anfang an.",
  tr1t:"Fotos sind freiwillig",tr1d:"Die Fotoanalyse ist optional und braucht deine ausdrückliche Zustimmung. Dein Profil entsteht auch nur aus dem Fragebogen.",
  tr2t:"Kein KI-Training",tr2d:"Deine Fotos werden nicht zum Training von KI-Modellen verwendet und nicht an Dritte verkauft.",
  tr3t:"Jederzeit löschen",tr3d:"Einzelne Fotos, dein Profil oder das ganze Konto kannst du in den Einstellungen selbst löschen. Deine Daten kannst du auch exportieren.",
  tr4t:"Geschützt nach DSGVO",tr4d:"Fotos liegen verschlüsselt in einem privaten Speicher. Nur du siehst sie, über kurzlebige, gesicherte Links.",
  faqTitle:"Häufige Fragen",
  f1q:"Ist SKIN AI kostenlos?",f1a:"Ja. Hauttest, Profil, Routine, Produktkatalog und Gesichtskarte sind kostenlos. Später kommen optionale Premium-Funktionen dazu. Was heute kostenlos ist, bleibt kostenlos.",
  f2q:"Ersetzt SKIN AI den Besuch beim Hautarzt?",f2a:"Nein. SKIN AI hilft bei der kosmetischen Hautpflege und stellt keine Diagnosen. Bei Hautkrankheiten, starken Beschwerden oder Muttermalen, die sich verändern, gehört die Haut in ärztliche Hände.",
  f3q:"Muss ich ein Foto hochladen?",f3a:"Nein. Die Fotoanalyse ist freiwillig. Dein Hautprofil und deine Routine entstehen auch nur aus dem Fragebogen.",
  f4q:"Woher kommen die Produktempfehlungen?",f4a:"Aus einer geprüften Produktdatenbank. Jedes Produkt wird mit vollständiger Inhaltsstoffliste und Hinweisen geprüft, bevor es empfohlen wird. Die Empfehlungen folgen festen Regeln, nicht dem Zufall einer KI.",
  f5q:"Verdient SKIN AI an den Produkten?",f5a:"Bei manchen Händlern erhalten wir eine Provision, wenn du über einen Link kaufst. Diese Links sind als Werbelink gekennzeichnet. Die Provision hat keinen Einfluss darauf, welche Produkte empfohlen werden.",
  f6q:"Kann ich meine eigenen Produkte eintragen?",f6a:"Ja. Du speicherst die Produkte, die du schon hast, und SKIN AI zeigt dir, wie sie in deine Routine passen und ob sich Wirkstoffe vertragen.",
  f8q:"Kann ich SKIN AI wie eine App installieren?",f8a:"Ja. Auf dem iPhone in Safari auf Teilen tippen und „Zum Home-Bildschirm“ wählen. Auf Android im Chrome-Menü „App installieren“ wählen. Danach öffnet sich SKIN AI ohne Browserleiste und funktioniert auch ohne Internet.",
  f7q:"In welchen Sprachen gibt es SKIN AI?",f7a:"Zum Start auf Deutsch und Rumänisch.",

  medNote:"<b>Wann zur Hautärztin oder zum Hautarzt?</b> Bei starker oder schmerzhafter Akne, anhaltenden Rötungen, Verdacht auf Rosazea, Ekzem oder Melasma und bei Muttermalen, die sich verändern. SKIN AI gibt dazu keine Einschätzung ab.",
  S:{
    normal:["Normale Haut","Ausgeglichen, feine Poren, selten Spannungsgefühl oder Glanz.","Ganzes Gesicht, gleichmäßig","Eine einfache Routine: milde Reinigung, Feuchtigkeit, täglicher Sonnenschutz.","Auch normale Haut braucht jeden Morgen Sonnenschutz."],
    dry:["Trockene Haut","Spannt nach dem Waschen, wirkt matt und kann schuppen. Feine Linien fallen schneller auf.","Vor allem Wangen und Stirn","Reichhaltige Pflege, die die Hautbarriere stärkt, und eine milde, cremige Reinigung.","Heißes Wasser und aggressive Reinigungsprodukte vermeiden."],
    oily:["Fettige Haut","Glänzt im ganzen Gesicht, die Poren sind gut sichtbar, Unreinheiten entstehen leicht.","Ganzes Gesicht, besonders die T-Zone","Leichte Gel-Texturen und Wirkstoffe, die Talg und Poren regulieren.","Auch fettige Haut braucht Feuchtigkeit. Zu starkes Entfetten macht es oft schlimmer."],
    combo:["Mischhaut","Stirn, Nase und Kinn glänzen, die Wangen sind normal bis trocken.","T-Zone: Stirn, Nase, Kinn","Leichte Pflege für das ganze Gesicht, gezielte Wirkstoffe nur in der T-Zone.","Du kannst Produkte zonenweise auftragen, zum Beispiel BHA nur auf die T-Zone."],
    sens:["Empfindliche Haut","Brennt, juckt oder rötet sich schnell, besonders bei neuen Produkten.","Oft Wangen und Nase","Wenige, parfümfreie Produkte mit beruhigenden Wirkstoffen.","Neue Produkte einzeln einführen und 48 Stunden an einer kleinen Stelle testen."],
    acne:["Akne & Unreinheiten","Pickel, entzündete Stellen und Mitesser, die immer wieder auftreten.","Stirn, Nase, Kinn und Kieferlinie","Wirkstoffe, die die Poren klären und Entzündungen beruhigen, langsam eingeführt.","Bei starker, schmerzhafter oder narbenbildender Akne zur Hautärztin oder zum Hautarzt."],
    pores:["Mitesser & große Poren","Dunkle Punkte und sichtbar erweiterte Poren.","Nase, Kinn und Stirn","Regelmäßiges, sanftes Peeling mit BHA, das in die Poren eindringt.","Nicht ausdrücken. Das reizt die Haut und kann Spuren hinterlassen."],
    pigment:["Pigmentflecken & Aknemale","Braune oder rötliche Flecken, oft nach Pickeln oder durch die Sonne.","Wangen und Stirn","Wirkstoffe, die Flecken aufhellen, und konsequenter Sonnenschutz.","Ohne täglichen Sonnenschutz kommen Flecken zurück. Großflächige Flecken (Melasma) hautärztlich abklären."],
    redness:["Rötungen & Rosazea","Gerötete Wangen und Nase, plötzliches Erröten, manchmal sichtbare Äderchen.","Wangen, Nase und Kinn","Beruhigende Pflege ohne Duftstoffe, ohne Alkohol und ohne starke Peelings.","Anhaltende Rötungen oder Verdacht auf Rosazea gehören in hautärztliche Hände."],
    dehyd:["Feuchtigkeitsmangel","Spannt und wirkt fahl, auch bei fettiger Haut. Make-up setzt sich in feinen Linien ab.","Ganzes Gesicht","Feuchtigkeitsspendende Wirkstoffe und eine Creme, die die Feuchtigkeit in der Haut hält.","Feuchtigkeitsmangel ist kein Hauttyp. Er kann bei jeder Haut auftreten."],
    mature:["Reife Haut","Nachlassende Spannkraft, feine Linien und Falten, oft trockener als früher, manchmal Pigmentflecken.","Augenpartie, Stirn und Wangen","Pflege, die die Hautbarriere stärkt, Retinoide langsam einführen und täglicher Sonnenschutz.","Reife Haut ist oft empfindlicher. Neue Wirkstoffe einzeln einführen."],
    dull:["Fahler Teint","Die Haut wirkt grau, müde und ohne Glanz, Make-up hält schlechter.","Ganzes Gesicht","Sanftes Peeling, Antioxidantien am Morgen und ausreichend Feuchtigkeit.","Schlaf, Stress und Rauchen spielen mit. Pflege allein löst nicht alles."],
    texture:["Unebene Hautstruktur","Die Haut fühlt sich rau an und wirkt uneben, oft mit kleinen Erhebungen.","Wangen, Stirn und Kinn","Regelmäßiges, mildes Peeling mit Fruchtsäuren, später Retinoide.","Nicht zu oft peelen. Mehr ist hier nicht besser."],
    closed:["Geschlossene Mitesser","Kleine, hautfarbene Knötchen unter der Haut, ohne schwarzen Punkt.","Stirn und Kinn","BHA löst Talg in den Poren, Azelainsäure und Niacinamid helfen zusätzlich.","Nicht ausdrücken. Sehr reichhaltige Cremes können sie verstärken."],
    eyes:["Augenringe & Schwellungen","Dunkle Schatten oder Schwellungen unter den Augen, morgens oft stärker.","Augenpartie","Augenpflege mit Koffein gegen Schwellungen, dazu Feuchtigkeit und täglicher Sonnenschutz.","Dunkle Augenringe sind oft erblich. Pflege kann sie mildern, aber selten ganz entfernen."],
    barrier:["Gestörte Hautbarriere","Die Haut brennt, spannt und rötet sich schon bei milden Produkten, oft nach zu viel Peeling.","Wangen, Nase und Kinn","Peelings und Wirkstoffe pausieren, nur milde Reinigung und eine Creme mit Ceramiden.","Bessert es sich nach zwei bis drei Wochen nicht, lass es hautärztlich abklären."],
    lines:["Feine Linien & Falten","Feine Linien um die Augen und auf der Stirn, nachlassende Spannkraft.","Augenpartie und Stirn","Retinoide langsam einführen, dazu Peptide und täglicher Sonnenschutz.","Retinoide machen die Haut sonnenempfindlicher. Nicht am selben Abend wie BHA verwenden."]

  I:{
    niacinamide:["Niacinamide (vitamin B3)","Strengthens the skin barrier, regulates oil, calms redness and fades dark spots.","Almost every skin type, especially combination and oily skin and dark spots.","Morning and/or evening, usually as a serum.","High concentrations can irritate sensitive skin. Start with a low percentage."],
    bha:["Salicylic acid (BHA)","Dissolves oil and dead skin cells inside pores, helps with blackheads and breakouts.","Oily skin, combination skin, blackheads, acne.","Evening, 2–3 times a week, building up slowly.","Can be drying. Use sunscreen the next day."],
    aha:["Fruit acids (AHA)","Exfoliate the skin's surface and make it smoother and more even.","Dull skin, rough texture, dark spots, normal to dry skin.","Evening, 1–3 times a week.","Make skin more sensitive to the sun. For sensitive skin, lactic acid is the gentler choice."],
    retinol:["Retinol (vitamin A)","Speeds up cell renewal, softens fine lines and refines the skin.","Fine lines, breakouts, uneven skin.","Evening only. Start 1–2 times a week, then build up slowly.","Can irritate and flake at first. Use sunscreen every day. Don't use during pregnancy or breastfeeding."],
    vitc:["Vitamin C","Antioxidant: protects against environmental stress, brightens and fades dark spots.","Dull skin, dark spots, morning protection.","Morning, before sunscreen.","Pure vitamin C is sensitive to light and air. If the product turns yellow or brown, it has oxidized."],
    azelaic:["Azelaic acid","Calms redness, helps with breakouts and fades dark spots.","Breakouts, redness, post-acne marks, sensitive skin.","Morning and/or evening.","May tingle slightly at first. With rosacea, agree on treatment with a dermatologist."],
    bpo:["Benzoyl peroxide","Fights the bacteria involved in acne.","Inflamed spots, acne.","As a spot treatment or cleanser, usually once a day.","Can bleach fabrics and hair and dry the skin."],
    ha:["Hyaluronic acid","Binds water in the skin and plumps it visibly.","All skin types, especially dehydrated skin.","Morning and evening on slightly damp skin, then moisturizer.","Without a cream on top, dry air can pull moisture back out."],
    ceramide:["Ceramides","Skin-identical lipids that strengthen the barrier and stop moisture loss.","Dry, sensitive or irritated skin.","Morning and evening, usually in a moisturizer.","Very well tolerated. Pairs with almost every active."],
    panthenol:["Panthenol (provitamin B5)","Soothes, hydrates and supports skin repair.","Sensitive, irritated or dry skin.","Morning and evening.","Very well tolerated."]
  },

  faqTitle:"Frequently asked questions",
  f1q:"Is SKIN AI free?",f1a:"Yes. The skin test, profile, routine, product catalog and face map are free. Optional premium features will come later. What is free today stays free.",

  f4q:"Where do the product recommendations come from?",f4a:"From a reviewed product database. Every product is checked with its full ingredient list and warnings before it is recommended. Recommendations follow fixed rules, not the whims of an AI.",
  f5q:"Does SKIN AI earn money from products?",f5a:"Some retailers pay us a commission when you buy through a link. These links are labeled as ads. The commission never affects which products are recommended.",

  S:{
    normal:["Normal skin","Balanced, fine pores, rarely tight or shiny.","Whole face, evenly","A simple routine: gentle cleanser, hydration, daily sunscreen.","Normal skin needs sunscreen every morning too."],
    dry:["Dry skin","Feels tight after washing, looks dull and can flake. Fine lines show sooner.","Mostly cheeks and forehead","Rich care that strengthens the skin barrier and a gentle, creamy cleanser.","Avoid hot water and harsh cleansers."],
    oily:["Oily skin","Shiny all over, pores are clearly visible, breakouts happen easily.","Whole face, especially the T-zone","Light gel textures and actives that regulate oil and pores.","Oily skin needs hydration too. Stripping it usually makes things worse."],
    combo:["Combination skin","Forehead, nose and chin are shiny, cheeks are normal to dry.","T-zone: forehead, nose, chin","Light care for the whole face, targeted actives only on the T-zone.","You can apply products by zone, for example BHA on the T-zone only."],
    sens:["Sensitive skin","Stings, itches or reddens quickly, especially with new products.","Often cheeks and nose","Few fragrance-free products with soothing actives.","Introduce new products one at a time and patch test them for 48 hours."],
    acne:["Acne & breakouts","Spots, inflamed areas and blackheads that keep coming back.","Forehead, nose, chin and jawline","Actives that clear pores and calm inflammation, introduced slowly.","For severe, painful or scarring acne, see a dermatologist."],
    pores:["Blackheads & large pores","Dark dots and visibly enlarged pores.","Nose, chin and forehead","Regular, gentle exfoliation with BHA, which gets into the pores.","Don't squeeze. It irritates the skin and can leave marks."],
    pigment:["Dark spots & post-acne marks","Brown or reddish spots, often after breakouts or from the sun.","Cheeks and forehead","Actives that fade spots and consistent sunscreen.","Without daily sunscreen, spots come back. Have widespread patches (melasma) checked by a dermatologist."],
    redness:["Redness & rosacea","Red cheeks and nose, sudden flushing, sometimes visible small veins.","Cheeks, nose and chin","Soothing care without fragrance, alcohol or strong exfoliants.","Persistent redness or suspected rosacea belongs in a dermatologist's hands."],
    dehyd:["Dehydration","Feels tight and looks dull, even when oily. Makeup settles into fine lines.","Whole face","Hydrating actives and a cream that keeps the moisture in.","Dehydration is not a skin type. It can happen to any skin."],
    mature:["Mature skin","Less firmness, fine lines and wrinkles, often drier than before, sometimes dark spots.","Eye area, forehead and cheeks","Care that strengthens the barrier, retinoids introduced slowly and daily sunscreen.","Mature skin is often more sensitive. Introduce new actives one at a time."],
    dull:["Dull complexion","Skin looks grey, tired and lacks glow, makeup lasts less well.","Whole face","Gentle exfoliation, antioxidants in the morning and enough hydration.","Sleep, stress and smoking play a part. Skincare alone can't fix everything."],
    texture:["Uneven texture","Skin feels rough and looks uneven, often with small bumps.","Cheeks, forehead and chin","Regular, mild exfoliation with fruit acids, later retinoids.","Don't exfoliate too often. More is not better here."],
    closed:["Closed comedones","Small, skin-colored bumps under the skin, without a dark dot.","Forehead and chin","BHA dissolves oil in the pores, azelaic acid and niacinamide help as well.","Don't squeeze. Very rich creams can make them worse."],
    eyes:["Dark circles & puffiness","Dark shadows or swelling under the eyes, often worse in the morning.","Eye area","Eye care with caffeine for puffiness, plus hydration and daily sunscreen.","Dark circles are often hereditary. Skincare can soften them but rarely removes them completely."],
    barrier:["Damaged skin barrier","Skin burns, feels tight and reddens even with gentle products, often after too much exfoliation.","Cheeks, nose and chin","Pause exfoliants and actives, use only a gentle cleanser and a ceramide cream.","If it doesn't improve within two to three weeks, see a dermatologist."],
    lines:["Fine lines & wrinkles","Fine lines around the eyes and on the forehead, less firmness.","Eye area and forehead","Retinoids introduced slowly, plus peptides and daily sunscreen.","Retinoids make skin more sun-sensitive. Don't use them on the same evening as BHA."]
  },

function score(){
  const s = {oily:0,combo:0,normal:0,dry:0,sens:0,dehyd:0}, concerns = new Set(), flags = new Set(); let spf=false;
  LOGIC.forEach(q => (st.a[q.k]||[]).forEach(j => {
    const v = q.o[j];
    for(const d in s) if(v[d]) s[d]+=v[d];
    if(v.c) concerns.add(v.c); if(v.flag) flags.add(v.flag); if(v.spf) spf=true;
  }));
  const r = ["oily","combo","normal","dry"].sort((x,y)=>s[y]-s[x]);
  if(s.dehyd) concerns.add("dehyd");
  return {type: s[r[0]]-s[r[1]] >= 1 ? r[0] : "und", sens: s.sens>=4?"high":s.sens>=2?"mid":"low", concerns:[...concerns], flags, spf};
}
function routine(r){
  const t = L().rt, moist = t.moist[r.type];
  const cl = (r.type==="dry"||r.sens==="high") ? t.cleanseSoft : t.cleanse;
  const am = [[cl,""],[moist, r.type==="dry"?"Ceramide NP · Glycerin":"Glycerin · Niacinamide"],[t.spf,t.spfNote]];
  const c = r.concerns, pm = [[cl,""]];
  if(r.sens==="high") pm.push([t.calm,"Panthenol · Ceramide NP · Allantoin"]);
  else {
    if(c.some(x=>["acne","blackheads","pores"].includes(x))) pm.push([t.bha,"Salicylic Acid"]);
    if(c.some(x=>["marks","pigment"].includes(x))) pm.push([t.spots,"Niacinamide · Azelaic Acid"]);
    if(c.includes("lines")) pm.push(r.flags.has("preg") ? [t.retinoidPreg,"Azelaic Acid · Niacinamide"] : [t.retinoid,"Retinol"]);
    if(c.includes("redness")) pm.push([t.red,"Azelaic Acid · Panthenol"]);
  }
  pm.push([moist,""]);
  return {am,pm};
}

function pairRule(a,b){
  const has = (x,y) => (a===x&&b===y)||(a===y&&b===x);
  const one = (x,list) => (a===x&&list.includes(b))||(b===x&&list.includes(a));
  if(a===b) return ["none",null];
  if(GENTLE.includes(a)||GENTLE.includes(b)) return ["good","gentle"];
  if(has("niacinamide","retinol")) return ["good","nia_ret"];
  if(has("niacinamide","vitc")) return ["good","nia_vitc"];
  if(a==="niacinamide"||b==="niacinamide") return ["good","nia_any"];
  if(one("retinol",ACIDS)) return ["split","ret_acid"];
  if(has("retinol","bpo")) return ["split","ret_bpo"];
  if(has("retinol","vitc")) return ["split","ret_vitc"];
  if(has("retinol","azelaic")) return ["caution","ret_aze"];
  if(has("aha","bha")) return ["caution","aha_bha"];
  if(one("vitc",ACIDS)) return ["split","vitc_acid"];
  if(has("vitc","bpo")) return ["split","vitc_bpo"];
  if(one("bpo",ACIDS)) return ["caution","bpo_acid"];
  if(one("azelaic",ACIDS)) return ["caution","aze_acid"];
  if(has("azelaic","vitc")) return ["good","aze_vitc"];

function rbPlan(){
  const prof = st.i >= LOGIC.length ? score() : null;
  const preg = !!(prof && prof.flags.has("preg")), sens = !!(prof && prof.sens==="high");
  const has = k => rbSel.includes(k) && !(k==="retinol" && preg);
  const by = k => RBP.find(p=>p.k===k);
  const am = RBP.filter(p => p.am && has(p.k)).map(p=>p.k);
  const pm = RBP.filter(p => p.pm && has(p.k)).map(p=>p.k);
  const groups = ["retinol","bha","aha"].filter(has);
  const notes = [];
  if(preg && rbSel.includes("retinol")) notes.push(["stop","preg"]);
  if(has("bpo")){
    if(has("vitc")){ groups.push("bpo"); if(has("retinol")) notes.push(["caution","bpoVitc"]); else notes.push(["info","bpoVitc"]); }
    else if(has("retinol")){ am.push("bpo"); notes.push(["info","bpoAm"]); }
    else pm.push("bpo");
  }
  am.sort((a,b)=>by(a).o-by(b).o); pm.sort((a,b)=>by(a).o-by(b).o);
  if(groups.length) { const i = pm.findIndex(k => by(k).o > 35); pm.splice(i<0 ? pm.length : i, 0, "_slot"); }
  const days = sens ? [0,3] : groups.length >= 3 ? [0,2,4,5] : groups.length === 2 ? [0,2,4,6] : [0,2,4];
  const week = Array(7).fill(null); days.forEach((d,i) => { if(groups.length) week[d] = groups[i % groups.length]; });

function inciLookup(name){
  const n = name.toLowerCase().replace(/\*+/g,"").replace(/\s+/g," ").trim();
  const cands = [n, n.replace(/\(.*?\)/g,"").trim(), ...(n.match(/\(([^)]*)\)/g)||[]).map(x=>x.slice(1,-1).trim())].filter(Boolean);
  for(const e of IDB){
    if(cands.some(c => e.exact.has(c) || e.partial.some(p => c.includes(p)))) return e;
  }
  return null;
}
